services:
  cursor-usage:
    build: .
    ports:
      # Must match the bridge's ingest URL (default http://127.0.0.1:8799/ingest)
      - "${PORT:-8799}:8799"
    environment:
      HOST: 0.0.0.0
      PORT: 8799
      DATA_DIR: /data
    volumes:
      - cursor-usage-data:/data
    restart: unless-stopped

volumes:
  cursor-usage-data:
